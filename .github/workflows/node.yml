name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npx prettier . --check

      - name: Build application
        run: npm run build

      - name: Check design-system ratchet
        run: npm run design:check

      - name: Check Pattern 3 vectors
        run: npm run check:pattern3-vectors

      - name: Run tests
        run: npm test --if-present

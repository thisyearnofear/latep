[package]
name = "pattern3"
version = "0.1.0"
authors = ["Latep"]

[build]
ci = true

[dependencies]
noir = "1.0.0-beta.9"
keccak256 = { tag = "v0.1.2", git = "https://github.com/noir-lang/keccak256" }
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }

[target pattern3]
crate_type = "compiler_builtins"

[profile.dev]
opt_level = "z"

[profile.test]
opt_level = "z"
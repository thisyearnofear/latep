<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;800&family=Inconsolata:wght@400;600&display=swap");

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .app-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .rail-label {
          position: absolute;
          left: 48px;
          bottom: 96px; /* above 17% keep-out */
          padding: 12px 22px;
          background: rgba(10, 14, 26, 0.86);
          border: 1px solid rgba(240, 160, 32, 0.55);
          font-family: "Inter", sans-serif;
          font-weight: 600;
          font-size: 20px;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: #f0a020;
          opacity: 0;
        }

        .seam-line {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 4px;
          background: linear-gradient(
            to bottom,
            transparent,
            #f0a020,
            transparent
          );
          opacity: 0;
          transform: translateX(0);
        }
      </style>

      <div
        id="root"
        data-composition-id="04-app-in-action"
        data-width="1920"
        data-height="1080"
        data-duration="20"
      >
        <!-- videos are hosted at the root of index.html; this sub-comp carries the seam + rails -->

        <!-- Hairline seam that sweeps left-to-right during the crossfade -->
        <div
          class="seam-line clip"
          id="app-seam"
          data-start="9.0"
          data-duration="1.6"
          data-track-index="1"
          data-layout-allow-overflow
        ></div>

        <!-- Rail label — text swaps in-place -->
        <div
          class="rail-label clip"
          id="app-rail-1"
          data-start="0.9"
          data-duration="9.1"
          data-track-index="2"
        >
          quiz your instincts
        </div>
        <div
          class="rail-label clip"
          id="app-rail-2"
          data-start="10.5"
          data-duration="9.5"
          data-track-index="3"
        >
          watch trust evolve at scale
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.9–1.5s): rail-1 types in
        tl.fromTo(
          "#app-rail-1",
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          0.95,
        );

        // Scene 3 (9.0–10.5s): hairline sweeps across the canvas as the seam cut
        tl.fromTo(
          "#app-seam",
          { opacity: 0.9, x: 0 },
          { opacity: 0.9, x: 1916, duration: 1.4, ease: "power3.inOut" },
          9.0,
        );
        tl.to("#app-seam", { opacity: 0, duration: 0.15 }, 10.4);

        // Scene 4 (10.5–11.1s): rail-2 fades in for the tournament beat
        tl.fromTo(
          "#app-rail-2",
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          10.55,
        );

        window.__timelines["04-app-in-action"] = tl;
      </script>
    </template>
  </body>
</html>

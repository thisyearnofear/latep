          left: 25%;

          left: 75%;

      <div

        data-width="1920"
        data-height="1080"
        data-duration="13"

        <div
          class="bg clip"
          data-start="0"
          data-duration="13"
          data-track-index="0"
        ></div>

        <div
          class="stage clip"
          data-start="0"
          data-duration="13"
          data-track-index="1"
        >
          <div class="mascot m-left" id="oc-m-left">
            <svg
              viewBox="0 0 60 88"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="#667eea"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="30" cy="14" r="10" />
              <line x1="30" y1="24" x2="30" y2="58" />
              <line x1="30" y1="34" x2="10" y2="48" />
              <line x1="30" y1="34" x2="50" y2="48" />
              <line x1="30" y1="58" x2="14" y2="82" />
              <line x1="30" y1="58" x2="46" y2="82" />
            </svg>
          </div>
          <div class="mascot m-right" id="oc-m-right">
            <svg
              viewBox="0 0 60 88"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="#f0a020"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="30" cy="14" r="10" />
              <line x1="30" y1="24" x2="30" y2="58" />
              <line x1="30" y1="34" x2="10" y2="48" />
              <line x1="30" y1="34" x2="50" y2="48" />

              <line x1="30" y1="58" x2="46" y2="82" />

          <div class="verdict-formula" id="oc-verdict">

            ><span class="ok">commitment ✓</span>

          <div class="arrow left" id="oc-arrow-left"></div>
          <div class="arrow right" id="oc-arrow-right"></div>
          <div class="arrow-head left" id="oc-arrow-head-left">←</div>
          <div class="arrow-head right" id="oc-arrow-head-right">→</div>

          <div class="payout left" id="oc-payout-left">+ 2.5 XLM</div>
          <div class="payout right" id="oc-payout-right">+ 2.5 XLM</div>

          </div>

      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–3.0s): mascots enter, escrow chip pops
        tl.fromTo(
          "#oc-m-left",
          { opacity: 0, x: -30 },
          { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          "#oc-m-right",
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          "#oc-escrow",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
          1.4,
        );

        // Scene 2 (3.0–7.0s): verdict formula lands, resolves with green ✓
        tl.fromTo(
          "#oc-verdict",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          3.2,
        );

        // Scene 3 (7.0–10.0s): arrows draw outward, payouts appear
        tl.to(
          "#oc-arrow-left",
          {
            scaleX: 1,
            duration: 0.6,
            ease: "power3.out",
            transformOrigin: "right center",
          },
          7.2,
        );
        tl.to(
          "#oc-arrow-right",
          { scaleX: 1, duration: 0.6, ease: "power3.out" },
          7.2,
        );
        tl.fromTo(
          "#oc-arrow-head-left",
          { opacity: 0, x: 6 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          7.7,
        );
        tl.fromTo(
          "#oc-arrow-head-right",
          { opacity: 0, x: -6 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          7.7,
        );
        tl.fromTo(
          "#oc-payout-left",
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          8.2,
        );
        tl.fromTo(
          "#oc-payout-right",
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          8.4,
        );

        // Scene 4 (10.0–13.0s): rail-label types in via clip-path, held read
        tl.to(
          "#oc-rail",
          { clipPath: "inset(0 0% 0 0)", duration: 2.0, ease: "power3.out" },
          10.2,
        );

        window.__timelines["10-outcome"] = tl;
      </script>

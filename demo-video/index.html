      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0e1a;
      }
      .host-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        z-index: 1;
      }
      .host-video.dimmed {
        opacity: 0.7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        overflow: hidden;
      }
    </style>
  </head>
